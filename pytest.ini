[pytest]
norecursedirs = tmp.* build benchmark OLD
# The default run is hermetic: no third-party sites, no installing
addopts = -p no:warnings -m "not network"
markers =
    network: reaches a service outside this machine
    installer: may install packages into the environment
testpaths =
    tests/basic
    tests/help
    tests/browser
    tests/scrape

env =
    PATCH_ANALYTICS=false
