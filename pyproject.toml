
[project]
name = "patch-code"
description = "Patch is AI pair programming in your terminal"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Software Development",
]
requires-python = ">=3.10,<3.15"
dynamic = ["version"]

# Published metadata names the direct dependencies, with a lower bound at the
# version Patch is tested against. The exact set that was tested lives in
# requirements.txt and the files under requirements/, which stay available for
# reproducible installs: pip install -r requirements.txt
dependencies = [
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    "backoff>=2.2.1",
    "beautifulsoup4>=4.14.3",
    "configargparse>=1.7.5",
    "diff-match-patch>=20241021",
    "diskcache>=5.6.3",
    "fastapi>=0.135.1",
    "flake8>=7.3.0",
    "GitPython>=3.1.46",
    "grep_ast>=0.9.0",
    # twine reads project metadata through importlib-metadata
    "importlib-metadata>=7.2.1,<8.0.0",
    "importlib_resources>=6.5.2",
    "json5>=0.13.0",
    "jsonschema>=4.26.0",
    "litellm>=1.82.3",
    "mixpanel>=5.0.0",
    # networkx 3.5 does not support Python 3.10
    "networkx>=3.4.2,<3.5",
    "numpy>=1.26.4,<2; python_version < '3.11'",
    "numpy>=2.3,<2.5; python_version >= '3.11'",
    "orjson>=3.11.7",
    "oslex>=0.1.3",
    "packaging>=26.0",
    "pathspec>=1.0.4",
    "pexpect>=4.9.0",
    "pillow>=12.1.1",
    "posthog>=7.9.12",
    "prompt_toolkit>=3.0.52",
    "psutil>=7.2.2",
    "pydub>=0.25.1",
    "pypandoc>=1.17",
    "pyperclip>=1.11.0",
    "PyYAML>=6.0.3",
    "rich>=14.3.3",
    "scipy>=1.13.1,<1.16; python_version < '3.11'",
    "scipy>=1.16.1,<1.18; python_version >= '3.11'",
    "shtab>=1.8.0",
    "socksio>=1.0.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "tree-sitter>=0.25.2",
    "watchfiles>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "codespell>=2.4.1",
    "contourpy>=1.3.2; python_version < '3.11'",
    "contourpy>=1.3.3; python_version >= '3.11'",
    "imgcat>=0.6.0",
    "lox>=0.13.1",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pip-tools>=7.5.1",
    "pre-commit>=4.4.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "typer>=0.21.1",
    "uv>=0.9.9",
]
help = [
    "llama-index-embeddings-huggingface>=0.6.1",
    "scikit-learn>=1.7.2",
    "torch>=2.3.0",
]
browser = ["streamlit>=1.54.0"]
playwright = ["playwright>=1.57.0"]

[project.urls]
Homepage = "https://github.com/PierrunoYT/patch"

[project.scripts]
patch = "patch.main:main"

[tool.setuptools.dynamic]
version = { attr = "patch.__version__" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["patch", "patch.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.codespell]
skip = "*.svg,tests/fixtures/*"
write-changes = true
