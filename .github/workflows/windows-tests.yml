name: Windows Python Tests

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'HISTORY.md'
      - '.github/workflows/*'
      - '!.github/workflows/windows-tests.yml'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'HISTORY.md'
      - '.github/workflows/*'
      - '!.github/workflows/windows-tests.yml'
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Pandoc
      run: choco install pandoc --no-progress -y

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Install the tested lock, not whatever the published bounds resolve to
        pip install -c requirements.txt .

    - name: Run tests
      env:
        PATCH_ANALYTICS: false
      run: |
        pytest

    - name: Run the tests that reach the network
      env:
        PATCH_ANALYTICS: false
      run: |
        pytest -m network

    - name: Test the built wheel outside the checkout
      shell: pwsh
      run: |
        python -m pip install build
        python -m build --wheel --outdir "$env:RUNNER_TEMP/dist" .
        python -m venv "$env:RUNNER_TEMP/wheel-venv"
        $python = "$env:RUNNER_TEMP/wheel-venv/Scripts/python.exe"
        & $python -m pip install --upgrade pip
        $wheel = (Get-ChildItem "$env:RUNNER_TEMP/dist/*.whl")[0].FullName
        & $python -m pip install -c requirements.txt $wheel
        Set-Location $env:RUNNER_TEMP
        & $python -m patch --version
        & $python -m patch --exit --yes --no-git --no-check-update
        
