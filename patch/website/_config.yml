theme: just-the-docs

# Analytics configuration
analytics:
  enabled: false  # Single switch to control analytics and cookie consent
  # The inherited key belonged to upstream Aider's PostHog project. Set a Patch
  # project key here before enabling analytics; do not report to upstream.
  posthog_key: ''
  posthog_host: 'https://us.i.posthog.com'

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: "README.md"
      type: "pages"
    values:
      description: "patch is AI pair programming in your terminal"

exclude:
  - "tmp*"
  - "**/tmp*"
  - OLD
  - "**/OLD/**"
  - "OLD/**"
  - vendor
  - feed.xml

aux_links:
  "GitHub":
    - "https://github.com/PierrunoYT/patch"
  "Issues":
    - "https://github.com/PierrunoYT/patch/issues"
  "Blog":
    - "/blog/"

nav_external_links:
  - title: "GitHub"
    url: "https://github.com/PierrunoYT/patch"
  - title: "Issues"
    url: "https://github.com/PierrunoYT/patch/issues"

repository: PierrunoYT/patch

callouts:
  tip:
    title: Tip
    color: green
  note:
    title: Note
    color: yellow

# Custom CSS for our table of contents
kramdown:
  syntax_highlighter_opts:
    css_class: highlight
    
sass:
  style: compressed
  
# Additional CSS
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  
