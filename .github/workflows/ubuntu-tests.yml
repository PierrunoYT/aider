name: Ubuntu Python Tests

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'HISTORY.md'
      - '.github/workflows/*'
      - '!.github/workflows/ubuntu-tests.yml'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'HISTORY.md'
      - '.github/workflows/*'
      - '!.github/workflows/ubuntu-tests.yml'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 pandoc

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Install the tested lock, not whatever the published bounds resolve to
        pip install -c requirements.txt .

    - name: Run tests
      env:
        PATCH_ANALYTICS: false
      run: |
        pytest

    - name: Run the tests that reach the network
      env:
        PATCH_ANALYTICS: false
      run: |
        pytest -m network

    - name: Test the built wheel outside the checkout
      run: |
        python -m pip install build
        python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
        python -m venv "$RUNNER_TEMP/wheel-venv"
        "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install           -c requirements.txt "$RUNNER_TEMP"/dist/*.whl
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/wheel-venv/bin/python" -m patch --version
        "$RUNNER_TEMP/wheel-venv/bin/python" -m patch --exit --yes --no-git --no-check-update
